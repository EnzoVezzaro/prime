[workspace]
resolver = "2"
members = [
    "prime-core",
    "prime-parser",
    "prime-index",
    "prime-query",
    "prime-cli",
    "prime-bench",
    "prime-mcp",
]

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"

# Parsing
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"

# Serialization
flatbuffers = "24.3"
bincode = "1.3"
rmp-serde = "1.1"

# Time
chrono = "0.4"

# Compression
zstd = "0.13"
lz4 = "1.28"

# Memory mapping
memmap2 = "0.9"
libc = "0.2"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async
tokio = { version = "1.38", features = ["full"] }
rayon = "1.10"

# Collections
indexmap = { version = "2.2", features = ["serde"] }
roaring = { version = "0.11", features = ["serde"] }

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1.5"
hex = "0.4"

# Testing
criterion = "0.5"
tempfile = "3.8"
num_cpus = "1.16"

# Progress
indicatif = "0.17"

# MCP
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }

# Ignore patterns
ignore = "0.4"
glob = "0.3"
walkdir = "2.5"



[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3

[workspace.metadata]
# Custom scripts for the workspace
# Usage: cargo run --bin prime <command>
# Or create aliases in your shell config
# Example shell aliases:
# alias prime-build="cargo run --bin prime -- build"
# alias prime-query="cargo run --bin prime -- query"
# alias prime-stats="cargo run --bin prime -- stats"
# alias prime-check="cargo run --bin prime -- check"
# alias prime-deps="cargo run --bin prime -- deps"
# alias prime-dependents="cargo run --bin prime -- dependents"
# alias prime-calls="cargo run --bin prime -- calls"
# alias prime-export="cargo run --bin prime -- export"
# alias prime-stats="cargo run --bin prime -- stats"
# alias prime-init="cargo run --bin prime -- init"
# alias prime-build-force="cargo run --bin prime -- build --force"
# alias prime-build-progress="cargo run --bin prime -- build --progress"
# alias prime-query-json="cargo run --bin prime -- query --format json"
# alias prime-query-minimal="cargo run --bin prime -- query --format minimal"
# alias prime-query-limit="cargo run --bin prime -- query --limit 50"
# alias prime-query-depth="cargo run --bin prime -- query --depth 3"
# alias prime-query-confidence="cargo run --bin prime -- query --confidence high"
# alias prime-query-budget="cargo run --bin prime -- query --token-budget 16384"
# alias prime-deps-transitive="cargo run --bin prime -- deps --transitive"
# alias prime-dependents-transitive="cargo run --bin prime -- dependents --transitive"
# alias prime-calls-callers="cargo run --bin prime -- calls --direction callers"
# alias prime-calls-callees="cargo run --bin prime -- calls --direction callees"
# alias prime-calls-both="cargo run --bin prime -- calls --direction both"
# alias prime-export-json="cargo run --bin prime -- export --format json"
# alias prime-export-msgpack="cargo run --bin prime -- export --format msgpack"
# alias prime-export-dot="cargo run --bin prime -- export --format dot"
# alias prime-export-output="cargo run --bin prime -- export --output ./output"
# alias prime-check="cargo run --bin prime -- check"
# alias prime-init="cargo run --bin prime -- init"
# alias prime-init-force="cargo run --bin prime -- init --force"

# For distribution builds:
# cargo build --release --workspace
# cargo install --path prime-cli --root ./dist
# cargo package --allow-dirty --workspace
# cargo publish --dry-run --workspace
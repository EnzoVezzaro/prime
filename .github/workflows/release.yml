name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Update version in Cargo.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" prime-rs/prime-cli/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" prime-rs/prime-core/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" prime-rs/prime-parser/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" prime-rs/prime-index/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" prime-rs/prime-query/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" prime-rs/prime-bench/Cargo.toml

      - name: Build release
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --workspace --release

      - name: Create binary archive
        run: |
          mkdir -p dist
          cp target/release/prime dist/prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu
          cd dist
          tar czf prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu
          sha256sum prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz > prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Prime ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            dist/prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu
            dist/prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            dist/prime-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish Crates
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Publish crates
        run: |
          cargo publish --workspace --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      
      - name: Publish crates (for real)
        if: github.event_name == 'push'
        run: |
          cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}